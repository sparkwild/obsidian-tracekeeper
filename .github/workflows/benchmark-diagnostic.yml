name: Knowledge Benchmark Diagnostic

on:
  workflow_dispatch:
    inputs:
      tier:
        description: Synthetic fixture tier.
        required: true
        default: 20k
        type: choice
        options:
          - 5k
          - 20k

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout selected candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run one diagnostic sample
        run: npm run benchmark:index -- --tier "${{ inputs.tier }}" --allow-scale --warmups 0 --repetitions 1

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-index-${{ inputs.tier }}-diagnostic-${{ github.sha }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: tmp/knowledge-index-reports/**
