name: Release Plugin

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build, for example 0.1.0.
        required: true
        type: string
      ref:
        description: Git ref to check out before building. Defaults to the version tag.
        required: false
        type: string
      publish:
        description: Publish the verified candidate to the version tag. Leave false for staging only.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
      sha: ${{ steps.checkout.outputs.sha }}
      artifact-name: tracekeeper-${{ steps.semver.outputs.version }}-${{ steps.checkout.outputs.sha }}

    steps:
      - name: Validate semver tag
        id: semver
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if ! echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$REF_NAME' is not strict semver."
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Resolve checked out commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify version tag binds checked out commit
        if: github.event_name == 'push' || inputs.publish
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          CHECKED_SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          if [ "$TAG_SHA" != "$CHECKED_SHA" ]; then
            echo "Version tag $VERSION resolves to $TAG_SHA, not checked commit $CHECKED_SHA."
            exit 1
          fi

      - name: Verify manifest version
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: tag=$VERSION manifest=$MANIFEST_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and package
        run: npm run verify

      - name: Check generated package artifacts
        run: git diff --exit-code -- apps/mcp-server/dist packages/core/dist packages/contracts/dist packages/mcp-runtime/dist

      - name: Generate release asset attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/obsidian-plugin/plugin/main.js
            apps/obsidian-plugin/plugin/manifest.json
            apps/obsidian-plugin/plugin/styles.css

      - name: Stage exact candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: tracekeeper-${{ steps.semver.outputs.version }}-${{ steps.checkout.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/obsidian-plugin/plugin/main.js
            apps/obsidian-plugin/plugin/manifest.json
            apps/obsidian-plugin/plugin/styles.css

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download staged candidate assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: candidate

      - name: Check existing release
        id: existing
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub release
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHECKED_SHA: ${{ needs.build.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --target "$CHECKED_SHA" \
            --title "$VERSION" \
            --notes "Release $VERSION" \
            candidate/main.js \
            candidate/manifest.json \
            candidate/styles.css

      - name: Update existing GitHub release assets
        if: steps.existing.outputs.exists == 'true'
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" \
            candidate/main.js \
            candidate/manifest.json \
            candidate/styles.css \
            --clobber
