name: Release Plugin

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Publish the verified draft for this X.Y.Z version.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: tracekeeper-release-${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      pull-requests: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.source.outputs.version }}
      sha: ${{ steps.source.outputs.sha }}
      artifact-name: ${{ steps.artifact.outputs.name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Verify tagged release PR
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: node scripts/plugin_release.mjs source "$VERSION" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify and package
        run: |
          npm ci
          npm run verify
          git diff --exit-code -- apps/mcp-server/dist packages/core/dist packages/contracts/dist packages/mcp-runtime/dist
          node scripts/plugin_release.mjs package apps/obsidian-plugin/plugin

      - name: Run release-scale 1k knowledge benchmark
        run: npm run benchmark:index -- --tier 1k --allow-scale --warmups 1 --repetitions 5

      - name: Upload release-scale 1k benchmark report
        if: always() && steps.source.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: knowledge-index-1k-${{ steps.source.outputs.version }}-${{ steps.source.outputs.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
          path: tmp/knowledge-index-reports/**

      - name: Generate release asset attestations
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            apps/obsidian-plugin/plugin/main.js
            apps/obsidian-plugin/plugin/manifest.json
            apps/obsidian-plugin/plugin/styles.css

      - name: Identify the build artifact
        id: artifact
        env:
          VERSION: ${{ steps.source.outputs.version }}
          SHA: ${{ steps.source.outputs.sha }}
        run: echo "name=tracekeeper-$VERSION-$SHA-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Transfer exact candidate assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.artifact.outputs.name }}
          if-no-files-found: error
          retention-days: 14
          path: apps/obsidian-plugin/plugin/

  draft:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: candidate

      - name: Prepare the GitHub draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: node scripts/plugin_release.mjs draft "$VERSION" "$SHA" candidate

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.event.repository.default_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: tracekeeper-publish
      cancel-in-progress: false
    permissions:
      contents: write
      actions: read
      pull-requests: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Verify and publish the existing draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: node scripts/plugin_release.mjs publish "$VERSION"
