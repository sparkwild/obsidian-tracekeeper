name: Release Plugin

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Release version to build, for example 0.1.0.
        required: true
        type: string
      ref:
        description: Git ref to check out before building. Defaults to the version tag.
        required: false
        type: string
      publish:
        description: Publish the verified candidate to the version tag. Leave false for staging only.
        required: false
        default: false
        type: boolean
      expected_main_sha256:
        description: Qualified staged main.js SHA-256. Required when publish is true.
        required: false
        type: string
      expected_manifest_sha256:
        description: Qualified staged manifest.json SHA-256. Required when publish is true.
        required: false
        type: string
      expected_styles_sha256:
        description: Qualified staged styles.css SHA-256. Required when publish is true.
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
      sha: ${{ steps.checkout.outputs.sha }}
      artifact-name: tracekeeper-${{ steps.semver.outputs.version }}-${{ steps.checkout.outputs.sha }}

    steps:
      - name: Validate semver tag
        id: semver
        env:
          REF_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          if ! echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$REF_NAME' is not strict semver."
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && (inputs.ref || inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Resolve checked out commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify version tag binds checked out commit
        if: github.event_name == 'push' || inputs.publish
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          CHECKED_SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          if [ "$TAG_SHA" != "$CHECKED_SHA" ]; then
            echo "Version tag $VERSION resolves to $TAG_SHA, not checked commit $CHECKED_SHA."
            exit 1
          fi

      - name: Verify candidate is the default-branch head
        if: github.event_name == 'push' || inputs.publish
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKED_SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          DEFAULT_SHA=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          if [ "$DEFAULT_SHA" != "$CHECKED_SHA" ]; then
            echo "Default branch $DEFAULT_BRANCH resolves to $DEFAULT_SHA, not checked commit $CHECKED_SHA."
            exit 1
          fi

      - name: Verify manifest version
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: tag=$VERSION manifest=$MANIFEST_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and package
        run: npm run verify

      - name: Check generated package artifacts
        run: git diff --exit-code -- apps/mcp-server/dist packages/core/dist packages/contracts/dist packages/mcp-runtime/dist

      - name: Verify qualified asset hashes for publication
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          EXPECTED_MAIN_SHA256: ${{ inputs.expected_main_sha256 }}
          EXPECTED_MANIFEST_SHA256: ${{ inputs.expected_manifest_sha256 }}
          EXPECTED_STYLES_SHA256: ${{ inputs.expected_styles_sha256 }}
        run: |
          verify_asset() {
            local expected="$1"
            local asset="$2"
            if ! [[ "$expected" =~ ^[0-9a-f]{64}$ ]]; then
              echo "Expected SHA-256 for $asset must be 64 lowercase hexadecimal characters."
              exit 1
            fi
            local actual
            actual=$(sha256sum "$asset" | awk '{print $1}')
            if [ "$actual" != "$expected" ]; then
              echo "Qualified SHA-256 for $asset is $expected, but the rebuilt asset is $actual."
              exit 1
            fi
          }
          verify_asset "$EXPECTED_MAIN_SHA256" apps/obsidian-plugin/plugin/main.js
          verify_asset "$EXPECTED_MANIFEST_SHA256" apps/obsidian-plugin/plugin/manifest.json
          verify_asset "$EXPECTED_STYLES_SHA256" apps/obsidian-plugin/plugin/styles.css

      - name: Generate release asset attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/obsidian-plugin/plugin/main.js
            apps/obsidian-plugin/plugin/manifest.json
            apps/obsidian-plugin/plugin/styles.css

      - name: Stage exact candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: tracekeeper-${{ steps.semver.outputs.version }}-${{ steps.checkout.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/obsidian-plugin/plugin/main.js
            apps/obsidian-plugin/plugin/manifest.json
            apps/obsidian-plugin/plugin/styles.css

  publish:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout publication identity
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download staged candidate assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: candidate

      - name: Revalidate publication identity
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKED_SHA: ${{ needs.build.outputs.sha }}
        run: |
          git fetch --force --no-tags origin \
            "+refs/tags/$VERSION:refs/tags/$VERSION" \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          DEFAULT_SHA=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          if [ "$TAG_SHA" != "$CHECKED_SHA" ]; then
            echo "Version tag $VERSION moved to $TAG_SHA after the build; refusing publication of $CHECKED_SHA."
            exit 1
          fi
          if [ "$DEFAULT_SHA" != "$CHECKED_SHA" ]; then
            echo "Default branch $DEFAULT_BRANCH moved to $DEFAULT_SHA after the build; refusing publication of $CHECKED_SHA."
            exit 1
          fi

      - name: Refuse existing release replacement
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to replace published assets."
            exit 1
          fi

      - name: Create GitHub release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHECKED_SHA: ${{ needs.build.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --verify-tag \
            --target "$CHECKED_SHA" \
            --title "$VERSION" \
            --notes "Release $VERSION" \
            candidate/main.js \
            candidate/manifest.json \
            candidate/styles.css
