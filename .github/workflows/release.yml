name: Release Plugin

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      version:
        description: Publish the qualified draft release for this strict x.y.z version.
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
      sha: ${{ steps.checkout.outputs.sha }}
      artifact-name: tracekeeper-${{ steps.semver.outputs.version }}-${{ steps.checkout.outputs.sha }}

    steps:
      - name: Validate semver tag
        id: semver
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! echo "$REF_NAME" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag '$REF_NAME' is not strict semver."
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Resolve checked out commit
        id: checkout
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify version tag binds checked out commit
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          CHECKED_SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          if [ "$TAG_SHA" != "$CHECKED_SHA" ]; then
            echo "Version tag $VERSION resolves to $TAG_SHA, not checked commit $CHECKED_SHA."
            exit 1
          fi

      - name: Verify candidate is the default-branch head
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKED_SHA: ${{ steps.checkout.outputs.sha }}
        run: |
          git fetch --no-tags origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          DEFAULT_SHA=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          if [ "$DEFAULT_SHA" != "$CHECKED_SHA" ]; then
            echo "Default branch $DEFAULT_BRANCH resolves to $DEFAULT_SHA, not checked commit $CHECKED_SHA."
            exit 1
          fi

      - name: Verify manifest version
        env:
          VERSION: ${{ steps.semver.outputs.version }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./manifest.json').version")
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: tag=$VERSION manifest=$MANIFEST_VERSION"
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and package
        run: npm run verify

      - name: Check generated package artifacts
        run: git diff --exit-code -- apps/mcp-server/dist packages/core/dist packages/contracts/dist packages/mcp-runtime/dist

      - name: Generate release asset attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            apps/obsidian-plugin/plugin/main.js
            apps/obsidian-plugin/plugin/manifest.json
            apps/obsidian-plugin/plugin/styles.css

      - name: Transfer exact candidate assets
        uses: actions/upload-artifact@v4
        with:
          name: tracekeeper-${{ steps.semver.outputs.version }}-${{ steps.checkout.outputs.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/obsidian-plugin/plugin/main.js
            apps/obsidian-plugin/plugin/manifest.json
            apps/obsidian-plugin/plugin/styles.css

  draft:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout draft identity
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download exact candidate assets
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact-name }}
          path: candidate

      - name: Revalidate draft identity
        env:
          VERSION: ${{ needs.build.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          CHECKED_SHA: ${{ needs.build.outputs.sha }}
        run: |
          git fetch --force --no-tags origin \
            "+refs/tags/$VERSION:refs/tags/$VERSION" \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          DEFAULT_SHA=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          if [ "$TAG_SHA" != "$CHECKED_SHA" ]; then
            echo "Version tag $VERSION moved to $TAG_SHA after the build; refusing draft creation for $CHECKED_SHA."
            exit 1
          fi
          if [ "$DEFAULT_SHA" != "$CHECKED_SHA" ]; then
            echo "Default branch $DEFAULT_BRANCH moved to $DEFAULT_SHA after the build; refusing draft creation for $CHECKED_SHA."
            exit 1
          fi

      - name: Refuse existing release replacement
        env:
          VERSION: ${{ needs.build.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; refusing to replace its assets."
            exit 1
          fi

      - name: Create GitHub draft release
        env:
          VERSION: ${{ needs.build.outputs.version }}
          CHECKED_SHA: ${{ needs.build.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$VERSION" \
            --draft \
            --verify-tag \
            --target "$CHECKED_SHA" \
            --title "$VERSION" \
            --generate-notes \
            candidate/main.js \
            candidate/manifest.json \
            candidate/styles.css

  publish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate release version
        id: semver
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Version '$VERSION' is not strict semver."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Checkout publication identity
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.semver.outputs.version }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag and default-branch manifest
        id: source
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --force --no-tags origin \
            "+refs/tags/$VERSION:refs/tags/$VERSION" \
            "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          TAG_SHA=$(git rev-parse "refs/tags/$VERSION^{commit}")
          DEFAULT_SHA=$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")
          if ! git merge-base --is-ancestor "$TAG_SHA" "$DEFAULT_SHA"; then
            echo "Version tag $VERSION is not contained in default branch $DEFAULT_BRANCH."
            exit 1
          fi
          DEFAULT_MANIFEST_VERSION=$(git show "refs/remotes/origin/$DEFAULT_BRANCH:manifest.json" | jq -r '.version')
          if [ "$DEFAULT_MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Default-branch manifest version is $DEFAULT_MANIFEST_VERSION, not $VERSION."
            exit 1
          fi
          echo "sha=$TAG_SHA" >> "$GITHUB_OUTPUT"

      - name: Verify qualified draft release
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_JSON=$(gh release view "$VERSION" --json tagName,isDraft,assets)
          if [ "$(jq -r '.tagName' <<< "$RELEASE_JSON")" != "$VERSION" ]; then
            echo "Draft release tag does not match $VERSION."
            exit 1
          fi
          if [ "$(jq -r '.isDraft' <<< "$RELEASE_JSON")" != "true" ]; then
            echo "Release $VERSION is not an unpublished draft."
            exit 1
          fi
          ACTUAL_ASSETS=$(jq -r '.assets[].name' <<< "$RELEASE_JSON" | LC_ALL=C sort)
          EXPECTED_ASSETS=$(printf '%s\n' main.js manifest.json styles.css | LC_ALL=C sort)
          if [ "$ACTUAL_ASSETS" != "$EXPECTED_ASSETS" ]; then
            echo "Draft release $VERSION must contain exactly main.js, manifest.json, and styles.css."
            printf 'Actual assets:\n%s\n' "$ACTUAL_ASSETS"
            exit 1
          fi
          mkdir candidate
          gh release download "$VERSION" \
            --dir candidate \
            --pattern main.js \
            --pattern manifest.json \
            --pattern styles.css
          MANIFEST_VERSION=$(jq -r '.version' candidate/manifest.json)
          if [ "$MANIFEST_VERSION" != "$VERSION" ]; then
            echo "Draft manifest version is $MANIFEST_VERSION, not $VERSION."
            exit 1
          fi

      - name: Verify draft asset attestations
        env:
          TAG_SHA: ${{ steps.source.outputs.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for asset in main.js manifest.json styles.css; do
            gh attestation verify "candidate/$asset" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$TAG_SHA"
          done

      - name: Publish verified GitHub release
        env:
          VERSION: ${{ steps.semver.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$VERSION" --draft=false
